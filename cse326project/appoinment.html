<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment - CMS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="appoinment.css">
    <script src="appoinment.js" defer></script>
</head>

<body class="appointment-body">

    <header class="appointment-header">
        <h1 class="cms-title">CITY MARRIAGE SYSTEM [CMS]</h1>
    </header>

    <main class="appointment-container">

        <h2 class="appointment-heading">BOOK YOUR SLOT</h2>

        <p class="appointment-description">
            Select your preferred date and time for your marriage registration appointment.
        </p>

        <form class="appointment-form">

            <div class="form-group">
                <label for="application-number">Enter Application Number</label>
                <input type="text" id="application-number" placeholder="Enter your application number" required>
            </div>

            <div class="form-group">
                <label for="appointment-date">Select Appointment Date</label>
                <input type="date" id="appointment-date" required>
            </div>

            <div class="form-group">
                <label for="appointment-time">Select Time Slot</label>
                <select id="appointment-time" required>
                    <option value="">Choose your time slot</option>
                    <option value="10:00 AM">10:00 AM - 11:00 AM</option>
                    <option value="11:00 AM">11:00 AM - 12:00 PM</option>
                    <option value="12:00 PM">12:00 PM - 01:00 PM</option>
                    <option value="02:00 PM">02:00 PM - 03:00 PM</option>
                    <option value="03:00 PM">03:00 PM - 04:00 PM</option>
                </select>
            </div>

            <button type="submit" class="book-btn">BOOK APPOINTMENT</button>

        </form>

    </main>

</body>

</html>
