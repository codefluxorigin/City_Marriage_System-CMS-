<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Status - CMS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="status.css">
</head>

<body class="status-body">

    <h1 class="status-title" id="site-title">
        CITY MARRAIGE SYSTEM [CMS]
    </h1>

    <div class="status-container" id="status-container">

        <h2 class="status-heading">
            Check Your Application Status
        </h2>

        <div class="application-section">
            <label for="application-number">Application number:</label>
            <input type="text" id="application-number" class="status-input" placeholder="Enter application number">
        </div>

        <br>

        <div class="otp-section">
            <label for="otp">Enter the OTP:</label>
            <input type="password" id="otp" class="status-input" placeholder="Enter your OTP">
        </div>

        <div class="track-section">
            <button class="track-btn" id="track-button">
                TRACK
            </button>
        </div>

    </div>

</body>

</html>
